name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: ["create-release"]
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: wally-package-types-win64
            cargo-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact-name: wally-package-types-linux-x86_64
            cargo-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            artifact-name: wally-package-types-linux-aarch64
            cargo-target: aarch64-unknown-linux-gnu
          - os: macos-latest
            artifact-name: wally-package-types-macos
            cargo-target: x86_64-apple-darwin
          - os: macos-latest
            artifact-name: wally-package-types-macos-aarch64
            cargo-target: aarch64-apple-darwin

    name: Build (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.cargo-target }} --no-self-update
          rustup default stable

      - name: Build Binary (All features)
        run: cargo build --verbose --locked --release --all-features --target ${{ matrix.cargo-target }}
        env:
          CARGO_TARGET_DIR: output

      - name: Setup Archive + Extension
        shell: bash
        run: |
          mkdir -p staging

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "output/${{ matrix.cargo-target }}/release/wally-package-types.exe" staging/
            cd staging
            7z a "../${{ matrix.artifact-name }}.zip" *
          else
            cp "output/${{ matrix.cargo-target }}/release/wally-package-types" staging/
            cd staging
            zip "../${{ matrix.artifact-name }}.zip" *
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip

      - name: Upload Binary to Release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact-name }}.zip" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_cargo:
    name: Publish to cargo
    # The crates.io package belongs to upstream; forks have no token to publish it
    if: github.repository == 'JohnnyMorganz/wally-package-types'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Publish to cargo
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
